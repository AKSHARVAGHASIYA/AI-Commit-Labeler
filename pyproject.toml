[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commit-labeler"
version = "0.1.0"
description = "AI-assisted GitHub commit annotation with human verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [
    { name = "Akshar Vaghasiya" }
]

keywords = [
    "git",
    "github",
    "machine-learning",
    "annotation",
    "dataset",
    "llm",
    "ai"
]

dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]